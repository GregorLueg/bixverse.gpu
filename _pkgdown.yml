url: https://gregorlueg.github.io/bixverse.gpu/

template:
  bootstrap: 5
  light-switch: true
  theme: atom-one-light
  theme-dark: atom-one-dark
  bslib:
    primary: "#3C4B6D"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: bixverse.gpu
  description: 
    GPU-accelerated methods for bixverse. This includes for now quite a few
    methods that make single cell analysis even faster, plus, some standard
    ML and statistical methods.
navbar:
  structure:
    left: [intro, reference, news, articles ]
    right: [search, lightswitch, github]
  components:
    articles:
      text: Articles
      menu:
        - text: GPU-acceleration for single cell
          href: articles/gpu_single_cell.html
        - text: SEACells with GPU-acceleration
          href: articles/gpu_metacells.html
        - text: SCENIC with GPU-acceleration
          href: articles/gpu_scenic.html
        - text: NMF with GPU-acceleration
          href: articles/gpu_nmf.html
        - text: Scrublet with GPU-acceleration
          href: articles/gpu_scrublet.html
        - text: GPU-accelerated UMAP
          href: articles/gpu_umap.html
        - text: GPU-accelerated t-SNE
          href: articles/gpu_tsne.html
        - text: Parametric UMAP
          href: articles/parametric_umap.html
        - text: Other GPU-accelerated methods
          href: articles/other_gpu.html
    github:
      icon: fab fa-github
      href: https://github.com/GregorLueg/bixverse.gpu
      aria-label: GitHub

articles:
  - title: Articles
    navbar: Articles
    contents:
      - gpu_single_cell
      - gpu_metacells
      - gpu_scenic
      - gpu_nmf
      - gpu_scrublet
      - gpu_umap
      - gpu_tsne
      - parametric_umap
      - other_gpu

reference:
  - title: Single cell GPU
    desc: 
      Different GPU-accelerated methods specifically for the single cell
      applications.
    contents:
      - calculate_pca_gpu_sc
      - generate_gpu_knn_sc
      - harmony_v2_gpu_sc
      - find_neighbours_gpu_sc
      - generate_seacells_gpu_sc
      - scenic_grn_sc_gpu
      - scrublet_gpu_sc
      - fast_cluster_gpu_sc
      - nmf_gpu_sc
      - stabilised_nmf_gpu_sc
      - consensus_nmf_gpu_sc
      - nmf_k_sweep_gpu_sc
      - params_sc_harmony_v2_gpu
      - params_sc_fast_cluster_gpu
      - params_scrublet_gpu
      - params_knn_gpu_defaults
  - title: GPU-accelerated UMAP
    desc:
      GPU-accelerated UMAP with pluggable kNN backends (IVF, NN-descent/CAGRA,
      exhaustive) and CPU/GPU optimisers. Also a version for the single cells
      analysis suite in bixverse.
    contents:
      - umap_gpu
      - umap_gpu_sc
      - params_umap_gpu
      - params_nn_gpu
  - title: GPU-accelerated t-SNE
    desc:
      t-SNE with GPU-accelerated kNN backends (IVF, NN-descent, exhaustive).
      Optimiser (BH or FFT) runs on CPU via the Rust implementation in
      manifoldsR. Also a version for the single cells analysis suite in 
      bixverse.
    contents:
      - tsne_gpu
      - tsne_gpu_sc
      - params_tsne_gpu
  - title: Parametric UMAP
    desc:
      Want to train a neural net to do your UMAP embeddings? Want to train
      flexibly on CPU or GPU? Here's what you need.
    contents:
      - parametric_umap
      - params_parametric_umap
      - predict.ParametricUmapModel
      - load_parametric_umap
      - save_parametric_umap
  - title: Other GPU-accelerated methods
    desc:
      Other GPU-accelerated methods that you might find useful... k-means
      clustering and a direct interface into the GPU-accelerated kNN searches
      can be found here.
    contents:
      - k_means_cluster_gpu
      - params_kmeans_gpu
      - generate_knn_graph_gpu
  - title: Rust wrappers
    desc: 
      Everything rusty - only use this if you know what you are doing... Maybe 
      useful for your own package? Use with care and read the documentation!
    contents:
      - rs_cor_gpu
      - rs_cov_gpu
      - rs_fast_cluster_gpu
      - rs_fast_cluster_grid_gpu
      - rs_harmony_v2_gpu
      - rs_gpu_knn
      - rs_kmeans_gpu
      - rs_mc_scenic_gpu
      - rs_nmf_consensus_mc_gpu
      - rs_nmf_consensus_sc_gpu
      - rs_nmf_k_sweep_mc_gpu
      - rs_nmf_k_sweep_sc_gpu
      - rs_nmf_multi_mc_gpu
      - rs_nmf_multi_sc_gpu
      - rs_nmf_single_mc_gpu
      - rs_nmf_single_sc_gpu
      - rs_parametric_umap_predict
      - rs_parametric_umap
      - rs_sc_pca_sparse_gpu
      - rs_sc_scrublet_gpu
      - rs_scenic_grn_gpu
      - rs_scenic_grn_streaming_gpu
      - rs_seacells_gpu
      - rs_umap_gpu
      - rs_umap_from_knn_gpu
      - rs_tsne_gpu
      - rs_tsne_from_knn_gpu
  - title: Deprecated
    desc:
      Kept so existing scripts keep running. Each one warns and forwards to its
      replacement.
    contents:
      - generate_cagra_knn_sc
      - find_neighbours_cagra_sc
      - params_sc_cagra
      - params_sc_ivf
      - rs_cagra_gpu_knn
      - rs_exhaustive_gpu_knn
      - rs_ivf_gpu_knn
