project:
  render:
    - "*.qmd"

# Vignettes execute locally against a real GPU and the results are committed
# under vignettes/_freeze/. CI has no GPU: wgpu falls back to lavapipe, which
# JITs every kernel on the CPU and is ~15x slower than the real thing.
#
# "auto" and not "true": the freeze cache stores the whole executed document,
# prose included. Under "true" quarto never re-executes, so a prose edit that
# was not re-rendered locally would publish the OLD prose with no warning.
# Under "auto" a changed .qmd re-executes, so the worst case is a slow CI run
# rather than a silently stale page. Re-render locally after editing and commit
# _freeze/ alongside the .qmd and CI never touches the GPU code.
execute:
  freeze: auto
