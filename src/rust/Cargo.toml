[package]
name = 'bixverse_gpu'
publish = false
version = '0.1.4'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse_gpu'

[dependencies]
ann-search-rs = { git = "https://github.com/GregorLueg/ann-search-rs", branch = "feat-turboquant-attempt2" , features = ["gpu"]}
bixverse-rs = { git = "https://github.com/GregorLueg/bixverse-rs.git", branch = "release-0.2.1", features = ["gpu"] }
cubecl = "0.10.0"
extendr-api = "0.9.0"
faer = { version = '0.23.2' }
manifolds-rs = { git = "https://github.com/GregorLueg/manifolds-rs.git", branch = "v0.2.6", features = ["parametric"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.21.0", features = ["wgpu", "flex"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.21.0", features = ["wgpu", "flex"] }

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "document"
path = "document.rs"
