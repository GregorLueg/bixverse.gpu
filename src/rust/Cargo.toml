[package]
name = 'bixverse_gpu'
publish = false
version = '0.5.0'
edition = '2021'
rust-version = '1.95'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse_gpu'

[features]
## Apple Silicon only: MLX backend via mlx-c. Off by default, since mlx-c is a
## system library we cannot ship. `tools/config.R` turns it on when
## `BIXVERSE_GPU_MLX=true` and finds `libmlxc.dylib`.
mlx = ["ann-search-rs/mlx", "bixverse-r/mlx", "manifolds-rs/mlx"]

[dependencies]
ann-search-rs = { version = "0.11.1", features = [ "gpu" ] }
burn = { version = "0.22.0", default-features = false, features = [ "std", "wgpu", "flex", "autodiff" ] }
bixverse-r = { version = "0.8.1", default-features = false, features = [ "sc-gpu", "bonsai" ] }
cubecl = "0.11.0"
cubecl-utils-rs = "0.2.0"
extendr-api = "0.9.0"
faer = { version = '0.24.4' }
indexmap = "2.13.0"
manifolds-rs = { version = "0.7.2", features = [ "fft_tsne", "gpu", "parametric" ] }
rand_distr = "0.5.1"
[target.'cfg(target_os = "macos")'.dependencies]
bixverse-r = { version = "0.8.0", default-features = false, features = [
    "accelerate",
] }

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "document"
path = "document.rs"
