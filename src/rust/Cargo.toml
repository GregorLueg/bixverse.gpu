[package]
name = 'bixverse_gpu'
publish = false
version = '0.1.3'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse_gpu'

[dependencies]
ann-search-rs = { version = "0.2.15", features = ["gpu"] }
bixverse-rs = "0.2.0"
cubecl = "0.9.0"
extendr-api = "0.9.0"
faer = { version = '0.23.2' }
manifolds-rs = { version = "0.2.4", features = ["parametric"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", features = ["wgpu", "ndarray", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.20.1", features = ["wgpu", "ndarray", "openblas-system"] }

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "document"
path = "document.rs"
