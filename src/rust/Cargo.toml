[package]
name = 'bixverse_gpu'
publish = false
version = '0.2.0'
edition = '2021'
rust-version = '1.95'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse_gpu'

[dependencies]
ann-search-rs = { version = "0.4.3", features = [ "gpu" ] }
burn = { version = "0.21.0", features = [ "wgpu", "flex" ] }
bixverse-rs = { version = "0.3.2", features = [ "gpu", "single-cell" ] }
cubecl = "0.10.0"
extendr-api = "0.9.0"
faer = { version = '0.23.2' }
manifolds-rs = { version = "0.3.4", features = [ "parametric" ] }

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "document"
path = "document.rs"
