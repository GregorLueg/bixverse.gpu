[package]
name = 'bixverse_gpu'
publish = false
version = '0.4.0'
edition = '2021'
rust-version = '1.95'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse_gpu'

[dependencies]
ann-search-rs = { version = "0.8.1", features = [ "gpu" ] }
burn = { version = "0.21.0", features = [ "wgpu", "flex" ] }
# DEV ONLY: bixverse-rs 0.5.0 is not on crates.io yet. Remove before merging,
# CI cannot resolve a path dep and the vendored offline build breaks on it.
bixverse-rs = { path = "/Users/gregorlueg/repos/shared/bixverse-rs", features = [ "gpu", "hdf5-static", "single-cell" ] }
cubecl = "0.10.0"
extendr-api = "0.9.0"
faer = { version = '0.23.2' }
indexmap = "2.13.0"
rand_distr = "0.5.1"
[target.'cfg(not(windows))'.dependencies]
manifolds-rs = { version = "0.4.0", features = [ "fft_tsne", "gpu", "parametric" ] }
[target.'cfg(windows)'.dependencies]
manifolds-rs = { version = "0.4.0", features = [ "parametric", "gpu"] }

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "document"
path = "document.rs"
