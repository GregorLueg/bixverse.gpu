name: pkgdown.yaml
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'vignettes/**'
      - 'README.md'
      - 'NEWS.md'
      - 'man/**'
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  release:
    types: [published]
  workflow_dispatch:
permissions: read-all
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      WGPU_BACKEND: vulkan
    permissions:
      contents: write
    steps:

      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # pak builds this package and the three GitHub Remotes in temp dirs, so
      # caching src/rust/target never hits. sccache caches per crate instead,
      # which is what actually pays: manifoldsR, bixverse and bixverse.gpu
      # share the ann-search-rs / bixverse-rs / manifolds-rs trees plus all of
      # cubecl, burn and wgpu underneath them.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Thin LTO over the cubecl/wgpu graph is the expensive part of the build
      # and the part sccache cannot cache. CI only needs a working binary, not
      # the fastest one; users still build with the Cargo.toml profile.
      - name: Cargo env
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "CARGO_NET_RETRY=10" >> $GITHUB_ENV
          echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse" >> $GITHUB_ENV
          echo "CARGO_TERM_COLOR=always" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> $GITHUB_ENV
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri \
            libopenblas-dev
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3
      
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
